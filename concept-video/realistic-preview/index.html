<script>
(()=>{const v=document.querySelector('#film'),nav=document.querySelector('#chapters');let pending=null;
const seek=()=>{if(pending!==null&&v.readyState>=1){v.currentTime=pending;pending=null;}};
v.addEventListener('loadedmetadata',seek);
fetch('chapters-v3.json').then(r=>{if(!r.ok)throw new Error();return r.json();}).then(data=>{
for(const c of data.chapters||[]){if(!Number.isFinite(c.start)||c.start<0)continue;const b=document.createElement('button');b.type='button';b.textContent=c.title;b.style.cssText='border:0;border-bottom:1px solid #bec4cb;background:transparent;color:#3b4655;padding:6px 2px;font:inherit;cursor:pointer';
b.addEventListener('click',()=>{pending=c.start;seek();v.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});v.play().catch(()=>{});});nav.appendChild(b);}
}).catch(()=>{});})();
</script>
